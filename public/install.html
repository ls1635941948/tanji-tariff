<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>手机安装 · 探迹关税</title><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/styles.css"><style>body{padding:30px 20px;background:#f5f7fb}.install-page{max-width:760px;margin:0 auto}.install-page header{display:flex;align-items:center;gap:14px;margin:30px 0}.install-page header img{width:54px;border-radius:14px}.install-page h1{font-size:25px;margin:0}.install-page header p{margin:5px 0 0;color:#65758c;font-size:14px}.install-box{background:white;border:1px solid #e4ebf4;border-radius:24px;padding:28px;display:grid;grid-template-columns:240px 1fr;gap:32px;align-items:center}.install-qr{width:100%;height:auto}.install-box h2{font-size:20px;margin-top:0}.install-box p{font-size:15px;line-height:1.9;color:#56667d}.install-url{display:block;overflow-wrap:anywhere;font-size:13px;color:#1769e0;margin:15px 0}.install-caption{font-size:13px!important;color:#7a8798!important}.install-back{display:inline-block;margin:24px 0;color:#1769e0;text-decoration:none}.install-local{display:block;font-size:13px;margin-top:10px;color:#65758c}@media(max-width:620px){.install-box{grid-template-columns:1fr;padding:24px;gap:12px}.install-qr{width:230px;justify-self:center}.install-box h2{text-align:center}}</style></head><body><main class="install-page"><header><img src="/icons/icon-192.png" alt="探迹关税图标"><div><h1>把探迹关税装进手机</h1><p>中国原产 → 美国 · HS / HTS 税则查询</p></div></header><section class="install-box"><img class="install-qr" src="/phone-qr.png" alt="用手机扫描，打开探迹关税"><div><h2>手机扫码，开始查询</h2><p><strong>iPhone：</strong>使用 Safari 打开，点击「分享」→「添加到主屏幕」；若出现「作为网页 App 打开」，保持开启后点「添加」。<br><strong>安卓：</strong>使用浏览器打开，点击「安装应用」或「添加到主屏幕」。</p><a id="mobile-url" class="install-url" href="/">直接打开应用 →</a><p class="install-caption">首次打开请保持联网，等页面显示「离线基础税则已保存」。基础查询之后可离线使用；附加税仍需联网核验。</p></div></section><p class="install-caption">这是手机试用版：在线查询和更新依赖这台电脑开机联网，临时网址可能变更。长期使用可部署到固定网址。微信扫码后，请从右上角菜单选择在浏览器中打开。</p><span id="local-url" class="install-local"></span><a class="install-back" href="/">← 返回查询首页</a></main><script src="/install.js" defer></script></body></html>
