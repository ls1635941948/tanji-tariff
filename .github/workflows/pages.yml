name: 发布手机查询

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 发布前下载并校验官方最新税则
        type: boolean
        default: true

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: 准备官方税则
        run: node scripts/prepare-data.mjs
      - name: 验证查询与数据
        run: node --test lib/*.test.mjs tests/*.test.mjs
      - name: 检查官方数据更新
        if: github.event_name == 'workflow_dispatch' && inputs.refresh_data
        run: node scripts/update-data.mjs
      - name: 读取网站路径
        id: pages
        uses: actions/configure-pages@v5
      - name: 构建独立手机版
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: node scripts/build-cloud.mjs --base "${PAGES_BASE_PATH}/" --out dist
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布固定网址
        id: deployment
        uses: actions/deploy-pages@v4
